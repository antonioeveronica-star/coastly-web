# Netlify configuration for Coastly website
[build]
  publish = "."
  command = ""
  functions = "netlify/functions"

# Disable password protection
[[basic_auth]]
  path = "/*"
  status = 0

# Cache configuration
[[headers]]
  for = "*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate, max-age=0"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate, max-age=0"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Redirects
[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/termini"
  to = "/termini.html"
  status = 200

[[redirects]]
  from = "/apple-callback"
  to = "/.netlify/functions/apple-callback"
  status = 200
  force = true

# Proxy della scheda pubblica al backend (Universal Links / App Links)
[[redirects]]
  from = "/lido/*"
  to = "https://coastly-api-j4hk.onrender.com/lido/:splat"
  status = 200
  force = true

[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"

[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
